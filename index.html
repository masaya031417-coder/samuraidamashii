<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Conversation Practice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 720px;
      padding: 20px 24px 12px;
      border-bottom: 1px solid #1e293b;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f8fafc;
    }

    header p {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 2px;
    }

    #chat-area {
      flex: 1;
      width: 100%;
      max-width: 720px;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: #3b82f6;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      align-self: flex-start;
      background: #1e293b;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .message.thinking {
      align-self: flex-start;
      background: #1e293b;
      color: #64748b;
      font-style: italic;
    }

    #controls {
      width: 100%;
      max-width: 720px;
      padding: 16px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #status {
      font-size: 0.82rem;
      color: #64748b;
      min-height: 1.2em;
      text-align: center;
    }

    #mic-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: #3b82f6;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 24px rgba(59,130,246,0.35);
    }

    #mic-btn:hover { background: #2563eb; }
    #mic-btn:active { transform: scale(0.94); }

    #mic-btn.recording {
      background: #ef4444;
      animation: pulse 1.2s infinite;
      box-shadow: 0 4px 24px rgba(239,68,68,0.45);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }

    #mic-btn svg { width: 30px; height: 30px; }

    #transcript-preview {
      font-size: 0.85rem;
      color: #94a3b8;
      min-height: 1.2em;
      text-align: center;
      max-width: 480px;
    }

    #error-banner {
      display: none;
      background: #7f1d1d;
      color: #fca5a5;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>

<header>
  <h1>English Conversation Practice</h1>
  <p>Tap the mic and speak — Gemma will reply in English</p>
</header>

<div id="chat-area"></div>

<div id="controls">
  <div id="error-banner"></div>
  <div id="transcript-preview"></div>
  <button id="mic-btn" title="Tap to speak">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v7a2 2 0 0 0 4 0V5a2 2 0 0 0-2-2zm-1 17.93V23h2v-2.07A8 8 0 0 0 20 13h-2a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93z"/>
    </svg>
  </button>
  <div id="status">Tap the mic to start speaking</div>
</div>

<script>
  const chatArea = document.getElementById('chat-area');
  const micBtn = document.getElementById('mic-btn');
  const statusEl = document.getElementById('status');
  const transcriptEl = document.getElementById('transcript-preview');
  const errorBanner = document.getElementById('error-banner');

  let history = [];
  let recognition = null;
  let isRecording = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    showError('Your browser does not support the Web Speech API. Please use Chrome or Edge.');
    micBtn.disabled = true;
  } else {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isRecording = true;
      micBtn.classList.add('recording');
      statusEl.textContent = 'Listening…';
      transcriptEl.textContent = '';
    };

    recognition.onresult = (event) => {
      let interim = '';
      let final = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) final += t;
        else interim += t;
      }
      transcriptEl.textContent = final || interim;
    };

    recognition.onerror = (event) => {
      stopRecording();
      if (event.error !== 'no-speech') {
        showError('Speech recognition error: ' + event.error);
      }
    };

    recognition.onend = () => {
      const text = transcriptEl.textContent.trim();
      stopRecording();
      if (text) {
        sendMessage(text);
      } else {
        statusEl.textContent = 'No speech detected. Tap to try again.';
      }
    };
  }

  function stopRecording() {
    isRecording = false;
    micBtn.classList.remove('recording');
  }

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
    setTimeout(() => { errorBanner.style.display = 'none'; }, 5000);
  }

  function hideError() {
    errorBanner.style.display = 'none';
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'message ' + role;
    div.textContent = text;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  micBtn.addEventListener('click', () => {
    if (!recognition) return;
    if (isRecording) {
      recognition.stop();
    } else {
      hideError();
      try {
        recognition.start();
      } catch (e) {
        showError('Could not start microphone: ' + e.message);
      }
    }
  });

  async function sendMessage(text) {
    transcriptEl.textContent = '';
    statusEl.textContent = 'Thinking…';
    addMessage('user', text);

    const thinking = addMessage('thinking', 'Gemma is typing…');

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || res.statusText);
      }

      const data = await res.json();
      const reply = data.reply;

      thinking.remove();
      addMessage('ai', reply);

      history.push({ role: 'user', content: text });
      history.push({ role: 'model', content: reply });

      speak(reply);
      statusEl.textContent = 'Tap the mic to continue';
    } catch (err) {
      thinking.remove();
      showError('Error: ' + err.message);
      statusEl.textContent = 'Tap the mic to try again';
    }
  }

  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'en-US';
    utt.rate = 0.95;

    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => v.lang.startsWith('en') && v.localService)
                   || voices.find(v => v.lang.startsWith('en'));
    if (preferred) utt.voice = preferred;

    window.speechSynthesis.speak(utt);
  }

  window.speechSynthesis && window.speechSynthesis.addEventListener('voiceschanged', () => {});
</script>
</body>
</html>
