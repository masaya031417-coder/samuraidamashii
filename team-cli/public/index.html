<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <title>AI会社チーム</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --bg2: #13131a;
      --bg3: #1a1a24;
      --border: #2a2a38;
      --accent: #00d4ff;
      --text: #e0e0e0;
      --dim: #888;
      --gold: #ffc107;
      --red: #ff4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; color: var(--accent); font-weight: 700; }
    header p { font-size: 0.7rem; color: var(--dim); }
    .header-right { display: flex; gap: 8px; }

    .toggle-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      color: var(--dim);
      font-size: 0.72rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .toggle-btn.on { border-color: var(--accent); color: var(--accent); background: #00d4ff18; }
    .toggle-btn.all { border-color: #a78bfa; color: #a78bfa; background: #a78bfa18; }

    /* ── Chat area ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .msg-user {
      align-self: flex-end;
      background: #1e3a6e;
      border-radius: 18px 18px 4px 18px;
      padding: 10px 15px;
      max-width: 82%;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .info-pill {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.75rem;
      color: var(--dim);
    }
    .info-pill.err { border-color: var(--red); color: var(--red); }

    .char-card {
      background: var(--bg2);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .char-head {
      padding: 8px 13px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .char-dept { font-weight: 400; color: var(--dim); font-size: 0.72rem; margin-left: 2px; }
    .char-body {
      padding: 10px 13px;
      font-size: 0.875rem;
      line-height: 1.65;
      color: #d5d5d5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .char-foot {
      padding: 5px 13px;
      font-size: 0.7rem;
      color: var(--dim);
      font-style: italic;
      border-top: 1px solid var(--border);
    }

    .summary-card {
      background: #120e00;
      border: 1px solid #4a3800;
      border-radius: 12px;
      overflow: hidden;
    }
    .summary-head {
      background: #1e1800;
      padding: 9px 13px;
      color: var(--gold);
      font-size: 0.83rem;
      font-weight: 700;
    }
    .summary-body {
      padding: 12px 13px;
      font-size: 0.875rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      color: #e5d5aa;
    }

    .typing { opacity: 0.5; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:.5} 50%{opacity:1} }

    /* ── Input area ── */
    #inputWrap {
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom, 10px));
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 15px;
      color: var(--text);
      font-size: 0.95rem;
      resize: none;
      max-height: 110px;
      outline: none;
      font-family: inherit;
      line-height: 1.4;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--dim); }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    #voiceBtn { background: var(--accent); color: #000; }
    #voiceBtn.rec { background: var(--red); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    #sendBtn { background: #003d80; color: #fff; }
    #sendBtn:disabled { background: var(--bg3); color: var(--dim); cursor: default; }
    #sendBtn:not(:disabled) { background: #0066cc; }

    /* Character color palette */
    .c-shin  { color: #00d4ff; } .bg-shin  { background: #00d4ff18; border-color: #00d4ff44; }
    .c-rex   { color: #ffc107; } .bg-rex   { background: #ffc10718; border-color: #ffc10744; }
    .c-maya  { color: #e040fb; } .bg-maya  { background: #e040fb18; border-color: #e040fb44; }
    .c-ken   { color: #00e676; } .bg-ken   { background: #00e67618; border-color: #00e67644; }
    .c-zero  { color: #ffee58; } .bg-zero  { background: #ffee5818; border-color: #ffee5844; }
    .c-rin   { color: #448aff; } .bg-rin   { background: #448aff18; border-color: #448aff44; }
    .c-lex   { color: #e0e0e0; } .bg-lex   { background: #e0e0e018; border-color: #e0e0e044; }
    .c-hana  { color: #f48fb1; } .bg-hana  { background: #f48fb118; border-color: #f48fb144; }
    .c-noa   { color: #80deea; } .bg-noa   { background: #80deea18; border-color: #80deea44; }
    .c-ami   { color: #ff5252; } .bg-ami   { background: #ff525218; border-color: #ff525244; }
    .c-sage  { color: #82b1ff; } .bg-sage  { background: #82b1ff18; border-color: #82b1ff44; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🏢 AI会社チーム</h1>
      <p>Multi-Agent • Claude powered</p>
    </div>
    <div class="header-right">
      <button class="toggle-btn" id="modeBtn" onclick="toggleMode()">🎯 スマート</button>
      <button class="toggle-btn" id="ttsBtn" onclick="toggleTTS()">🔇 音声</button>
    </div>
  </header>

  <div id="chat">
    <div class="info-pill">👋 マイクボタンで音声入力、またはテキストで質問してください。</div>
  </div>

  <div id="inputWrap">
    <div class="input-row">
      <button class="icon-btn" id="voiceBtn" onclick="toggleVoice()" title="音声入力">🎤</button>
      <textarea id="textInput" placeholder="チームへの質問..." rows="1"
        onkeydown="onKey(event)" oninput="resize(this)"></textarea>
      <button class="icon-btn" id="sendBtn" onclick="send()" disabled>➤</button>
    </div>
  </div>

<script>
  /* ─── State ─── */
  let mode = 'smart';
  let ttsOn = false;
  let isRec = false;
  let busy = false;
  let recog = null;

  const chat = document.getElementById('chat');
  const input = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');

  /* ─── Input helpers ─── */
  input.addEventListener('input', () => {
    sendBtn.disabled = !input.value.trim() || busy;
  });

  function resize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 110) + 'px';
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  /* ─── Mode / TTS toggles ─── */
  function toggleMode() {
    mode = mode === 'smart' ? 'all' : 'smart';
    const btn = document.getElementById('modeBtn');
    if (mode === 'all') {
      btn.textContent = '👥 全員';
      btn.className = 'toggle-btn all';
    } else {
      btn.textContent = '🎯 スマート';
      btn.className = 'toggle-btn';
    }
  }

  function toggleTTS() {
    ttsOn = !ttsOn;
    const btn = document.getElementById('ttsBtn');
    btn.textContent = ttsOn ? '🔊 音声ON' : '🔇 音声';
    btn.className = 'toggle-btn' + (ttsOn ? ' on' : '');
    if (!ttsOn) speechSynthesis.cancel();
  }

  /* ─── Voice input ─── */
  function toggleVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('このブラウザは音声認識未対応です（Chromeを使用してください）'); return; }

    if (isRec) { recog.stop(); return; }

    recog = new SR();
    recog.lang = 'ja-JP';
    recog.interimResults = true;

    recog.onstart = () => {
      isRec = true;
      const btn = document.getElementById('voiceBtn');
      btn.className = 'icon-btn rec';
      btn.textContent = '⏹';
    };

    recog.onresult = (e) => {
      const t = Array.from(e.results).map(r => r[0].transcript).join('');
      input.value = t;
      resize(input);
      sendBtn.disabled = !t.trim() || busy;
      if (e.results[e.results.length - 1].isFinal) {
        recog.stop();
        setTimeout(send, 400);
      }
    };

    recog.onend = () => {
      isRec = false;
      const btn = document.getElementById('voiceBtn');
      btn.className = 'icon-btn';
      btn.textContent = '🎤';
    };

    recog.onerror = () => { isRec = false; };
    recog.start();
  }

  /* ─── TTS ─── */
  function speak(text) {
    if (!ttsOn || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/#+\s*/g, '').slice(0, 500));
    u.lang = 'ja-JP';
    u.rate = 1.1;
    speechSynthesis.speak(u);
  }

  /* ─── UI helpers ─── */
  function esc(t) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(t));
    return d.innerHTML;
  }

  function append(el) {
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  function pill(text, err = false) {
    const d = document.createElement('div');
    d.className = 'info-pill' + (err ? ' err' : '');
    d.textContent = text;
    return append(d);
  }

  /* ─── Main send ─── */
  async function send() {
    const q = input.value.trim();
    if (!q || busy) return;

    busy = true;
    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    /* User bubble */
    const ub = document.createElement('div');
    ub.className = 'msg-user';
    ub.textContent = q;
    append(ub);

    const loader = pill('⏳ チームを招集中…');

    try {
      const resp = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, mode }),
      });

      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      loader.remove();

      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      let curCard = null, curBody = null;
      let sumCard = null, sumBody = null;

      const onEvent = (data) => {
        switch (data.type) {
          case 'routing': {
            pill(`🎯 ${data.reason}`);
            break;
          }
          case 'character_start': {
            const id = (data.id || data.name || '').toLowerCase();
            curCard = document.createElement('div');
            curCard.className = `char-card bg-${id}`;

            const head = document.createElement('div');
            head.className = `char-head c-${id}`;
            head.innerHTML = `${esc(data.emoji)} ${esc(data.name)}<span class="char-dept">${esc(data.department)}</span>`;

            curBody = document.createElement('div');
            curBody.className = 'char-body typing';

            curCard.appendChild(head);
            curCard.appendChild(curBody);
            append(curCard);
            break;
          }
          case 'chunk': {
            if (curBody) {
              curBody.classList.remove('typing');
              curBody.textContent += data.text;
              chat.scrollTop = chat.scrollHeight;
            } else if (sumBody) {
              sumBody.textContent += data.text;
              chat.scrollTop = chat.scrollHeight;
            }
            break;
          }
          case 'character_end': {
            if (curCard && curBody) {
              const foot = document.createElement('div');
              foot.className = 'char-foot';
              foot.textContent = `「${data.catchphrase}」`;
              curCard.appendChild(foot);
              speak(curBody.textContent);
            }
            curCard = null; curBody = null;
            break;
          }
          case 'summary_start': {
            sumCard = document.createElement('div');
            sumCard.className = 'summary-card';

            const head = document.createElement('div');
            head.className = 'summary-head';
            head.textContent = '📋 統合レポート Summary';

            sumBody = document.createElement('div');
            sumBody.className = 'summary-body typing';

            sumCard.appendChild(head);
            sumCard.appendChild(sumBody);
            append(sumCard);
            break;
          }
          case 'summary_chunk': {
            if (sumBody) {
              sumBody.classList.remove('typing');
              sumBody.textContent += data.text;
              chat.scrollTop = chat.scrollHeight;
            }
            break;
          }
          case 'summary_end': {
            if (sumBody) speak(sumBody.textContent);
            sumCard = null; sumBody = null;
            break;
          }
          case 'error': {
            pill(`⚠️ ${data.message}`, true);
            break;
          }
        }
      };

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() ?? '';
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try { onEvent(JSON.parse(line.slice(6))); } catch {}
        }
      }

    } catch (err) {
      loader.remove();
      pill(`⚠️ 接続エラー: ${err.message}`, true);
    }

    busy = false;
    sendBtn.disabled = !input.value.trim();
  }
</script>
</body>
</html>
